<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Queue Control — PHP Clinic</title>
  <script src="config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy:       #1a3a8f;
      --navy-dark:  #0f2460;
      --navy-light: #dce6f9;
      --coral:      #f28b82;
      --coral-dark: #d96b62;
      --green:      #2d8a5e;
      --green-light:#d4f0e4;
      --amber:      #d97706;
      --amber-light:#fef3c7;
      --border:     #c8d3ec;
      --text:       #1a1a2e;
      --text-muted: #5a6380;
      --bg:         #f4f7fe;
      --white:      #ffffff;
      --radius:     14px;
      --shadow:     0 4px 24px rgba(26,58,143,0.10);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1.5px solid rgba(26,58,143,0.07);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .card-title {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.1rem;
      color: var(--navy);
      margin-bottom: 0.25rem;
    }

    .card-sub {
      font-size: 0.83rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    /* ── Current number display ── */
    .current-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2rem;
    }

    .current-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.3em;
      color: var(--coral);
      margin-bottom: 0.25rem;
    }

    .current-number {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 8rem;
      line-height: 1;
      color: var(--navy);
      letter-spacing: -0.02em;
      transition: transform 0.15s ease;
    }

    .current-number.bump {
      transform: scale(1.08);
    }

    .up-next-preview {
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    /* ── Buttons ── */
    .btn-next {
      width: 100%;
      background: var(--navy);
      color: white;
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.4rem;
      padding: 1.1rem;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      margin-bottom: 0.75rem;
      letter-spacing: 0.02em;
    }

    .btn-next:hover  { background: #122a6e; }
    .btn-next:active { transform: scale(0.97); }
    .btn-next:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-prev {
      width: 100%;
      background: none;
      color: var(--text-muted);
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 0.65rem;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      margin-bottom: 0.5rem;
    }

    .btn-prev:hover { border-color: var(--navy); color: var(--navy); }
    .btn-prev:disabled { opacity: 0.3; cursor: not-allowed; }

    .btn-reset {
      width: 100%;
      background: none;
      color: var(--coral-dark);
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.83rem;
      padding: 0.55rem;
      border: 1.5px solid var(--coral);
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 0.5rem;
    }

    .btn-reset:hover { background: #fde8e6; }

    .divider {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin: 1.25rem 0;
    }

    .msg {
      font-size: 0.8rem;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      margin-top: 0.75rem;
      display: none;
    }
    .msg.success { display: block; background: var(--green-light); color: var(--green); }
    .msg.error   { display: block; background: #fde8e6; color: var(--coral-dark); }

    .back-link {
      margin-top: 1.5rem;
      font-size: 0.83rem;
      color: var(--text-muted);
      text-decoration: none;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
    }
    .back-link:hover { color: var(--navy); }

    .display-link {
      display: inline-block;
      margin-top: 0.75rem;
      font-size: 0.8rem;
      color: var(--navy);
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-title">🎛️ Queue Control</div>
    <div class="card-sub">People Helping Pets — Vaccine Clinic</div>

    <div class="current-wrap">
      <div class="current-label">Now Serving</div>
      <div class="current-number" id="currentNumber">—</div>
      <div class="up-next-preview" id="upNextPreview">Up next: —</div>
    </div>

    <button class="btn-next" id="nextBtn" onclick="advance()" disabled>
      ➜ Next Number
    </button>
    <button class="btn-prev" id="prevBtn" onclick="goBack()" disabled>
      ← Go Back One
    </button>

    <div class="divider"></div>

    <button class="btn-reset" onclick="resetQueue()">↺ Reset to #1</button>

    <div class="msg" id="msg"></div>
  </div>

  <a class="display-link" href="queue-display.html" target="_blank">↗ Open display screen</a>
  <a class="back-link" href="staff-home.html">← Back to Staff Home</a>

  <script>
    const SUPABASE_URL      = CONFIG.SUPABASE_URL;
    const SUPABASE_ANON_KEY = CONFIG.SUPABASE_ANON_KEY;

    const token = localStorage.getItem('php_token');
    if (!token) window.location.href = 'dashboard.html';

    function authHeaders() {
      return {
        'apikey':        SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${token}`,
        'Content-Type':  'application/json',
        'Prefer':        'return=representation'
      };
    }

    function showMsg(type, text) {
      const el = document.getElementById('msg');
      el.className = `msg ${type}`;
      el.textContent = text;
      setTimeout(() => el.className = 'msg', 3000);
    }

    function renderNumber(n) {
      document.getElementById('currentNumber').textContent = `#${n}–#${n+2}`;
      el.textContent = `#${n}`;
      el.classList.add('bump');
      setTimeout(() => el.classList.remove('bump'), 150);
      document.getElementById('upNextPreview').textContent = `Up next: #${n+3}, #${n+4}, #${n+5}`;
      document.getElementById('nextBtn').disabled = false;
      document.getElementById('prevBtn').disabled = n <= 1;
    }

    let current = null;

    async function load() {
      try {
        const res  = await fetch(`${SUPABASE_URL}/rest/v1/queue_state?id=eq.1&select=now_serving`, {
          headers: {
            'apikey':        SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${token}`,
            'Accept':        'application/json'
          }
        });
        const [row] = await res.json();
        if (!row) { showMsg('error', 'Could not load queue state.'); return; }
        current = row.now_serving;
        renderNumber(current);
      } catch (err) {
        showMsg('error', err.message);
      }
    }

    async function update(newVal) {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/queue_state?id=eq.1`, {
          method:  'PATCH',
          headers: authHeaders(),
          body:    JSON.stringify({ now_serving: newVal, updated_at: new Date().toISOString() })
        });
        if (!res.ok) throw new Error('Update failed');
        current = newVal;
        renderNumber(current);
      } catch (err) {
        showMsg('error', err.message);
      }
    }

    function advance() {
      if (current === null) return;
      update(current + 3);
    }

    function goBack() {
      if (current === null || current <= 1) return;
      update(Math.max(1, current - 3));
    }

    async function resetQueue() {
      if (!confirm('Reset queue to #1? This cannot be undone.')) return;
      await update(1);
      showMsg('success', 'Queue reset to #1.');
    }

    console.log('CONFIG at script time:', typeof CONFIG, typeof CONFIG !== 'undefined' ? CONFIG.SUPABASE_URL : 'MISSING');
    window.addEventListener('load', load);
  </script>
</body>
</html>
