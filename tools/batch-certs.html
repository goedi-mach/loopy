<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Batch Certificates — Pawkit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <script src="../config.js"></script>
  <style>
    :root {
      --navy:        #1a3a8f;
      --navy-dark:   #122a6e;
      --navy-light:  #dce6f9;
      --navy-mid:    #4a6cc0;
      --coral:       #f28b82;
      --coral-light: #fde8e6;
      --coral-dark:  #d96b62;
      --green:       #2d8a5e;
      --green-light: #d4f0e4;
      --amber:       #d97706;
      --amber-light: #fef3c7;
      --text:        #1a1a2e;
      --text-muted:  #5a6380;
      --border:      #c8d3ec;
      --bg:          #f4f7fe;
      --white:       #ffffff;
      --radius:      12px;
      --shadow:      0 2px 16px rgba(26,58,143,0.10);
      --shadow-lg:   0 8px 32px rgba(26,58,143,0.15);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── NAV ── */
    .topnav {
      background: var(--navy);
      color: white;
      padding: 0 1.5rem;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topnav-brand {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
      color: white;
      text-decoration: none;
      margin-right: auto;
    }
    .nav-link {
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-size: 0.83rem;
      font-weight: 700;
      padding: 0.3rem 0.7rem;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .nav-link:hover { background: rgba(255,255,255,0.15); color: white; }
    .nav-link.active { background: rgba(255,255,255,0.2); color: white; }

    /* ── LAYOUT ── */
    .main {
      max-width: 760px;
      margin: 2rem auto;
      padding: 0 1.25rem 3rem;
    }

    .page-header {
      margin-bottom: 1.75rem;
    }
    .page-title {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1.5rem;
      color: var(--navy);
    }
    .page-sub {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
    }

    /* ── CARD ── */
    .card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 1.25rem;
      overflow: hidden;
    }
    .card-header {
      padding: 0.9rem 1.25rem;
      border-bottom: 1.5px solid var(--border);
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--navy);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-body { padding: 1.25rem; }

    /* ── FILTERS ── */
    .filter-row {
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .filter-group { display: flex; flex-direction: column; gap: 0.3rem; }
    .filter-group label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
    }
    .filter-group input[type="date"] {
      padding: 0.45rem 0.75rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text);
      background: var(--bg);
    }
    .filter-group input[type="date"]:focus {
      outline: none;
      border-color: var(--navy);
    }

    .btn-primary {
      background: var(--navy);
      color: white;
      border: none;
      border-radius: 999px;
      padding: 0.5rem 1.4rem;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary:hover:not(:disabled) { background: var(--navy-dark); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-download {
      background: var(--green);
      color: white;
      border: none;
      border-radius: 999px;
      padding: 0.55rem 1.5rem;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .btn-download:hover:not(:disabled) { background: #236b48; }
    .btn-download:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── RESULTS TABLE ── */
    .results-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .results-table th {
      text-align: left;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      padding: 0.5rem 0.75rem;
      border-bottom: 1.5px solid var(--border);
      background: var(--bg);
    }
    .results-table td {
      padding: 0.65rem 0.75rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .results-table tr:last-child td { border-bottom: none; }
    .results-table tr:hover td { background: var(--navy-light); }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.88rem;
      padding: 2rem 1rem;
    }

    /* ── STATUS BADGE ── */
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
    }
    .badge-ok   { background: var(--green-light); color: var(--green); }
    .badge-warn { background: var(--amber-light); color: var(--amber); }

    /* ── PROGRESS ── */
    .progress-wrap {
      display: none;
      margin-top: 1rem;
    }
    .progress-label {
      font-size: 0.83rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }
    .progress-bar-track {
      height: 8px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--navy);
      border-radius: 999px;
      width: 0%;
      transition: width 0.2s;
    }

    /* ── MSG ── */
    .msg {
      padding: 0.6rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      display: none;
      margin-top: 1rem;
    }
    .msg.error   { background: var(--coral-light); color: var(--coral-dark); display: block; }
    .msg.success { background: var(--green-light);  color: var(--green);      display: block; }
    .msg.info    { background: var(--navy-light);   color: var(--navy);       display: block; }
  </style>
</head>
<body>

<!-- Progress overlay -->
<div id="progressOverlay" style="display:none; position:fixed; top:0; left:0; right:0; z-index:200; background:var(--navy); color:white; padding:0.6rem 1.5rem; font-size:0.85rem; font-weight:700; font-family:'Nunito',sans-serif; box-shadow:0 2px 12px rgba(0,0,0,0.2);">
  <div id="overlayLabel" style="margin-bottom:0.35rem;">Generating PDFs…</div>
  <div style="height:6px; background:rgba(255,255,255,0.25); border-radius:999px; overflow:hidden;">
    <div id="overlayFill" style="height:100%; background:white; border-radius:999px; width:0%; transition:width 0.2s;"></div>
  </div>
</div>

<nav class="topnav">
  <a href="../staff-home.html" class="topnav-brand">🐾 Pawkit</a>
  <div style="font-size:0.8rem; opacity:0.8;" id="loggedInUser"></div>
  <a href="../discharge.html" class="nav-link">💉 Discharge</a>
  <a href="../records.html" class="nav-link">📋 Records</a>
  <a href="../reports.html" class="nav-link">📊 Reports</a>
  <a href="../staff-home.html" class="nav-link">🏠 Staff Home</a>
</nav>

<div class="main">
  <div class="page-header">
    <div class="page-title">📄 Batch Rabies Certificates</div>
    <div class="page-sub">Generate and download all rabies certificates from a clinic date as a zip file.</div>
  </div>

  <!-- DATE PICKER -->
  <div class="card">
    <div class="card-header">Select Clinic Date</div>
    <div class="card-body">
      <div class="filter-row">
        <div class="filter-group">
          <label>Clinic Date</label>
          <input type="date" id="clinicDate" />
        </div>
        <button class="btn-primary" onclick="loadCerts()">Load Certificates</button>
      </div>
      <div class="msg" id="loadMsg"></div>
    </div>
  </div>

  <!-- RESULTS -->
  <div class="card" id="resultsCard" style="display:none;">
    <div class="card-header">
      <span id="resultsTitle">Rabies Certificates</span>
      <button class="btn-download" id="downloadBtn" onclick="downloadAll()" disabled>
        ⬇ Download All as ZIP
      </button>
    </div>
    <div class="card-body" style="padding:0;">
      <table class="results-table">
        <thead>
          <tr>
            <th>Pet</th>
            <th>Owner</th>
            <th>Rabies Tag</th>
            <th>Vaccine</th>
            <th>Vet</th>
          </tr>
        </thead>
        <tbody id="resultsBody">
        </tbody>
      </table>
    </div>
    <div class="card-body" style="border-top: 1.5px solid var(--border);">
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-label" id="progressLabel">Generating PDFs…</div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
      </div>
      <div class="msg" id="downloadMsg"></div>
    </div>
  </div>
</div>

<script>
  // ─── CONFIG & AUTH ─────────────────────────────────────────────
  const SUPABASE_URL      = CONFIG.SUPABASE_URL;
  const SUPABASE_ANON_KEY = CONFIG.SUPABASE_ANON_KEY;
  let accessToken = null;

  function authHeaders() {
    return {
      'Content-Type':  'application/json',
      'apikey':        SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${accessToken || SUPABASE_ANON_KEY}`
    };
  }

  function handleExpired(res) {
    if (res.status === 401) {
      localStorage.removeItem('php_token');
      localStorage.removeItem('php_email');
      window.location.href = '../login.html?expired=1';
      return true;
    }
    return false;
  }

  async function sbGet(path) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers: authHeaders() });
    if (handleExpired(res)) throw new Error('Session expired');
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).message || res.statusText);
    return res.json();
  }

  function showMsg(el, type, text) {
    el.className = `msg ${type}`;
    el.textContent = text;
  }

  // ─── AUTH GUARD ────────────────────────────────────────────────
  (function() {
    const token = localStorage.getItem('php_token');
    if (!token) { window.location.href = 'login.html'; return; }
    try {
      const payload = JSON.parse(atob(token.split('.')[1]));
      const role = payload?.app_metadata?.role;
      if (!['staff', 'admin'].includes(role)) {
        window.location.href = 'volunteer-home.html';
        return;
      }
      accessToken = token;
      const email = localStorage.getItem('php_email');
      if (email) document.getElementById('loggedInUser').textContent = `👋 ${email}`;
    } catch {
      window.location.href = 'login.html';
    }
  })();

  // Default date to today
  document.getElementById('clinicDate').value = new Date().toISOString().split('T')[0];

  // ─── STATE ─────────────────────────────────────────────────────
  let rabiesRecords = []; // array of enriched records ready for PDF gen

  // ─── LOAD CERTS ────────────────────────────────────────────────
  async function loadCerts() {
    const date   = document.getElementById('clinicDate').value;
    const msgEl  = document.getElementById('loadMsg');
    msgEl.className = 'msg';

    if (!date) { showMsg(msgEl, 'error', 'Please select a date.'); return; }

    showMsg(msgEl, 'info', 'Loading…');
    document.getElementById('resultsCard').style.display = 'none';
    rabiesRecords = [];

    try {
      // Fetch all rabies vaccinations for the date
      const vaxRows = await sbGet(
        `vaccinations?date_given=eq.${date}&vaccine_name=ilike.*Rabies*&order=date_given.asc`
      );

      if (!vaxRows.length) {
        showMsg(msgEl, 'info', `No rabies vaccinations found for ${date}.`);
        return;
      }

      // Collect unique pet_ids and fetch pets + clients
      const petIds = [...new Set(vaxRows.map(v => v.pet_id))];
      const petsRaw = await sbGet(
        `pets?id=in.(${petIds.join(',')})&select=*,clients(*)`
      );
      const petMap = {};
      petsRaw.forEach(p => { petMap[p.id] = p; });

      // Enrich each vax row with pet + client
      rabiesRecords = vaxRows.map(v => {
        const pet    = petMap[v.pet_id] || {};
        const clientRaw = pet.clients;
        const client = Array.isArray(clientRaw) ? (clientRaw[0] || {}) : (clientRaw || {});
        return {
          ...v,
          pet:    pet,
          client: client,
          // fields generateRabiesCertPDF expects at top level:
          colors_markings:   v.colors_markings,
          rabies_tag_number: v.rabies_tag_number,
          product_name:      v.product_name,
          manufacturer:      v.manufacturer,
          usda_duration:     v.usda_duration,
          dose_type:         v.dose_type,
          ac_license_number: v.ac_license_number,
          ac_license_type:   v.ac_license_type,
        };
      });

      msgEl.className = 'msg'; // hide msg

      // Render table
      const tbody = document.getElementById('resultsBody');
      tbody.innerHTML = rabiesRecords.map(r => `
        <tr>
          <td><strong>${r.pet?.name || '—'}</strong>
            <div style="font-size:0.78rem;color:var(--text-muted);">${r.pet?.species || ''} · ${r.pet?.breed || ''}</div>
          </td>
          <td>${r.client?.name || '—'}
            <div style="font-size:0.78rem;color:var(--text-muted);">${r.client?.phone || ''}</div>
          </td>
          <td>${r.rabies_tag_number
            ? `<span class="badge badge-ok">${r.rabies_tag_number}</span>`
            : `<span class="badge badge-warn">No tag</span>`}</td>
          <td style="font-size:0.82rem;">${r.vaccine_name || '—'}</td>
          <td style="font-size:0.82rem;">${r.administered_by || '—'}</td>
        </tr>
      `).join('');

      document.getElementById('resultsTitle').textContent =
        `${rabiesRecords.length} Rabies Certificate${rabiesRecords.length !== 1 ? 's' : ''} — ${date}`;
      document.getElementById('downloadBtn').disabled = false;
      document.getElementById('resultsCard').style.display = 'block';
      document.getElementById('downloadMsg').className = 'msg';
      document.getElementById('progressWrap').style.display = 'none';

    } catch (err) {
      showMsg(msgEl, 'error', 'Error loading records: ' + err.message);
    }
  }

  // ─── PDF GENERATION (copied from discharge.html) ───────────────
  async function ensurePDFLib() {
    if (window.PDFLib) return;
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';
      s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  async function generateRabiesCertPDF(r) {
    await ensurePDFLib();
    const { PDFDocument, PDFName, PDFString } = window.PDFLib;

    const templateUrl = `${SUPABASE_URL}/storage/v1/object/public/templates/RabiesVacCert.pdf`;
    const templateRes = await fetch(templateUrl);
    const templateBytes = await templateRes.arrayBuffer();

    const pdfDoc = await PDFDocument.load(templateBytes);
    const form   = pdfDoc.getForm();
    const page   = pdfDoc.getPages()[0];

    function toWinAnsi(str) {
      return String(str)
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')  // strip combining diacritics
        .replace(/[^\x00-\xFF]/g, '?');   // replace anything outside latin-1 with ?
    }

    function setText(fieldName, value, fontSize) {
      try {
        if (!value) return;
        value = toWinAnsi(value);
        const field = form.getTextField(fieldName);
        const v  = PDFString.of(String(value));
        const da = `0 0 0 rg /Helv ${fontSize || 10} Tf`;
        field.acroField.dict.set(PDFName.of('V'),  v);
        field.acroField.dict.set(PDFName.of('DA'), PDFString.of(da));
        for (const w of field.acroField.getWidgets()) {
          w.dict.set(PDFName.of('V'), v);
        }
      } catch(e) { console.warn(`setText "${fieldName}" failed:`, e.message); }
    }

    function setRadio(fieldName, index) {
      try {
        if (index == null) return;
        const field   = form.getRadioGroup(fieldName);
        const widgets = field.acroField.getWidgets();
        const onKey   = PDFName.of(String(index));
        for (let i = 0; i < widgets.length; i++) {
          widgets[i].dict.set(PDFName.of('AS'), i === index ? onKey : PDFName.of('Off'));
        }
        field.acroField.dict.set(PDFName.of('V'), onKey);
      } catch(e) { console.warn(`setRadio "${fieldName}" failed:`, e.message); }
    }

    function setCheck(fieldName, checked) {
      try {
        checked ? form.getCheckBox(fieldName).check()
                : form.getCheckBox(fieldName).uncheck();
      } catch(_) {}
    }

    const pet    = r.pet    || {};
    const client = r.client || {};

    // Owner
    const nameParts = (client.name || '').trim().split(' ');
    setText('First Name', nameParts[0] || '');
    setText('Last Name',  nameParts.slice(1).join(' ') || '');
    setText('Telephone #', client.phone || '', 9);

    const addr = (client.address || (
      client.street
        ? [client.street, client.city, (client.state ? client.state.toUpperCase() : ''), client.zip]
            .filter(Boolean).join(', ')
        : ''
    )).trim();
    if (addr) {
      // Normalize spelled-out state names to abbreviations
      const stateAbbr = { illinois:'IL', indiana:'IN', wisconsin:'WI', michigan:'MI', iowa:'IA', missouri:'MO' };
      const normalized = addr.replace(
        /\b(illinois|indiana|wisconsin|michigan|iowa|missouri)\b/gi,
        w => stateAbbr[w.toLowerCase()]
      );
      // Match: <street>, <city> <ST> <ZIP>  (comma before city is optional)
      // Works for: "1052 N Lawndale Ave., Chicago IL 60651"
      //            "4137 W Wellington St., Chicago IL 60641"
  
      const m = normalized.match(/^(.+?),\s*([A-Za-z ]+?)\s+([A-Z]{2})\s+(\d[\d-]*)$/);
      if (m) {
        setText('Street',   m[1].trim());
        setText('City',     m[2].trim());
        setText('State',    m[3].trim());
        setText('Zip Code', m[4].trim());
      } else {
        // Last resort: split on commas
        const parts = addr.split(',').map(s => s.trim());
        if (parts[0]) setText('Street', parts[0]);
        if (parts[1]) setText('City',   parts[1]);
        if (parts[2]) {
          const sz = parts[2].trim().split(/\s+/);
          setText('State',    sz[0] || '');
          setText('Zip Code', sz[1] || '');
        }
      }
    }

    // Pet
    setText('Animal Name',                pet.name             || '');
    setText('Microchip #',                pet.microchip_number || '', 8);
    setText('Predominent Breed',          pet.breed            || '', 9);
    setText('Predominemt Colors/Markings', r.colors_markings   || '', 8);

    const ageNum = parseFloat(pet.age);
    if (!isNaN(ageNum)) {
      const isMonths = (pet.age_unit || 'years') === 'months';
      setText('Age', String(ageNum), 9);
      setRadio('Months/Years', isMonths ? 0 : 1);
    }

    const w = parseFloat(pet.weight);
    if (!isNaN(w)) setRadio('Size', w < 20 ? 0 : w <= 50 ? 1 : 2);

    const speciesMap = { dog: 0, cat: 1, ferret: 2 };
    const speciesIdx = speciesMap[(pet.species || '').toLowerCase()];
    if (speciesIdx != null) setRadio('Species', speciesIdx);

    if (pet.sex === 'male')   setRadio('Sex', 0);
    if (pet.sex === 'female') setRadio('Sex', 1);
    setCheck('Neutered', pet.altered === 'yes');

    // Rabies fields
    setText('Rabies Tag #',          r.rabies_tag_number || '', 9);
    setText('Product Name',          r.product_name      || '', 9);
    setText('Vaccine Serial Number', r.lot_number        || '', 9);
    setText('License Number',        CONFIG.VET_LICENSE_VALBUENA, 9);
    
    const man = (r.manufacturer || '').toUpperCase().padEnd(3, ' ');
    setText('Manufacturer', man[0]);
    setText('Man2',         man[1]);
    setText('Man3',         man[2]);

    const usdaMap = { '1yr': 0, '3yr': 1, '4yr': 2 };
    if (r.usda_duration) setRadio('USDA Licensed Vaccine', usdaMap[r.usda_duration]);

    if (r.dose_type === 'initial') setRadio('Dose', 0);
    if (r.dose_type === 'booster') setRadio('Dose', 1);

    if (r.usda_duration === '1yr')   setCheck('AC 1 year', true);
    if (r.usda_duration === '3yr')   setCheck('AC 3 year', true);
    if (r.usda_duration === 'other') setCheck('AC other',  true);

    const fmtDate = iso => {
      if (!iso) return '';
      const d = new Date(iso + 'T12:00:00');
      return d.toLocaleDateString('en-US', { month:'2-digit', day:'2-digit', year:'numeric' });
    };
    setText('Date Vaccinated',       fmtDate(r.date_given), 9);
    setText('Next Vaccination Date', fmtDate(r.next_due),   9);

    // Vet
    setText("Veterinarian's Name",    'Dr. Ana Valbuena', 9);
    setText("Veterinarian's address", 'People Helping Pets, Chicago IL',     8);

    // Vet signature
    try {
      const sigFile  = 'ana_signature.png';
      const sigBytes = await fetch(
        `${SUPABASE_URL}/storage/v1/object/public/templates/${sigFile}`
      ).then(res => res.arrayBuffer());
      const sigImg = await pdfDoc.embedPng(sigBytes);
      page.drawImage(sigImg, { x: 370, y: 452, width: 175, height: 28 });
    } catch (_) {}

    form.flatten();
    const pdfBytes = await pdfDoc.save();
    return new Blob([pdfBytes], { type: 'application/pdf' });
  }

  // ─── DOWNLOAD ALL AS ZIP ────────────────────────────────────────
  async function downloadAll() {
    const btn      = document.getElementById('downloadBtn');
    const msgEl    = document.getElementById('downloadMsg');
    const progress = document.getElementById('progressWrap');
    const fill     = document.getElementById('progressFill');
    const label    = document.getElementById('progressLabel');

    btn.disabled = true;
    msgEl.className = 'msg';
    progress.style.display = 'none';
    document.getElementById('progressOverlay').style.display = 'block';

    try {
      // Load JSZip dynamically
      if (!window.JSZip) {
        await new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
          s.onload = resolve; s.onerror = reject;
          document.head.appendChild(s);
        });
      }

      const zip   = new window.JSZip();
      const total = rabiesRecords.length;

      for (let i = 0; i < total; i++) {
        const r = rabiesRecords[i];
        const petName    = (r.pet?.name    || 'UnknownPet').replace(/[^a-zA-Z0-9]/g, '_');
        const ownerLast  = (r.client?.name || 'UnknownOwner').trim().split(' ').pop().replace(/[^a-zA-Z0-9]/g, '_');
        const filename   = `RabiesCert_${petName}_${ownerLast}_${r.date_given}.pdf`;

        document.getElementById('overlayLabel').textContent = `Generating ${i + 1} of ${total}: ${r.pet?.name || ''}…`;
        document.getElementById('overlayFill').style.width  = `${Math.round((i / total) * 100)}%`;

        const blob       = await generateRabiesCertPDF(r);        
        const arrayBuf   = await blob.arrayBuffer();
        zip.file(filename, arrayBuf);
      }

      document.getElementById('overlayFill').style.width  = '100%';
      document.getElementById('overlayLabel').textContent = 'Creating zip file…';

      const date    = document.getElementById('clinicDate').value;
      const zipBlob = await zip.generateAsync({ type: 'blob' });
      const url     = URL.createObjectURL(zipBlob);
      const a       = document.createElement('a');
      a.href        = url;
      a.download    = `RabiesCerts_${date}.zip`;
      a.click();
      URL.revokeObjectURL(url);

      document.getElementById('progressOverlay').style.display = 'none';
      showMsg(msgEl, 'success', `✓ Downloaded ${total} certificate${total !== 1 ? 's' : ''} as a zip file.`);

    } catch (err) {
      document.getElementById('progressOverlay').style.display = 'none';
      showMsg(msgEl, 'error', 'Error generating zip: ' + err.message);
      console.error(err);
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
