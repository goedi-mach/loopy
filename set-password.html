<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set Password — Pawkit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <script src="config.js"></script>
  <style>
    :root {
      --navy:       #1a3a8f;
      --navy-light: #dce6f9;
      --coral:      #f28b82;
      --text:       #1a1a2e;
      --text-muted: #5a6380;
      --bg:         #f4f7fe;
      --radius:     14px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: white;
      border-radius: var(--radius);
      box-shadow: 0 4px 24px rgba(26,58,143,0.10);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
    }
    .logo {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.4rem;
      color: var(--navy);
      margin-bottom: 0.25rem;
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 0.88rem;
      margin-bottom: 0.35rem;
      color: var(--text);
    }
    input[type="password"] {
      width: 100%;
      padding: 0.65rem 0.9rem;
      border: 1.5px solid var(--navy-light);
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      margin-bottom: 1rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="password"]:focus { border-color: var(--navy); }
    .btn {
      width: 100%;
      background: var(--navy);
      color: white;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover:not(:disabled) { background: #122a6e; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg {
      margin-top: 1rem;
      font-size: 0.88rem;
      padding: 0.6rem 0.9rem;
      border-radius: 8px;
      display: none;
    }
    .msg.error   { display: block; background: #fde8e6; color: #b91c1c; }
    .msg.success { display: block; background: #d1fae5; color: #065f46; }
    #loadingState { color: var(--text-muted); font-size: 0.95rem; }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">🐾 Pawkit</div>
  <div class="subtitle">People Helping Pets</div>

  <!-- Shown while we verify the token from the URL -->
  <div id="loadingState">Verifying your link…</div>

  <!-- Shown once token is valid -->
  <div id="formState" style="display:none">
    <p style="margin-bottom:1.5rem; font-size:0.95rem; color:var(--text-muted);">
      Choose a new password for your account.
    </p>
    <label for="newPassword">New password</label>
    <input type="password" id="newPassword" placeholder="At least 8 characters" autocomplete="new-password" />
    <label for="confirmPassword">Confirm password</label>
    <input type="password" id="confirmPassword" placeholder="Repeat password" autocomplete="new-password" />
    <button class="btn" id="submitBtn" onclick="setPassword()">Set Password</button>
    <div class="msg" id="formMsg"></div>
  </div>

  <!-- Shown on success -->
  <div id="successState" style="display:none">
    <p style="color:#065f46; background:#d1fae5; padding:1rem; border-radius:8px; font-weight:600;">
      ✅ Password set! You can now <a href="login.html" style="color:var(--navy); font-weight:800;">sign in</a>.
    </p>
  </div>

  <!-- Shown if link is invalid/expired -->
  <div id="errorState" style="display:none">
    <p style="color:#b91c1c; background:#fde8e6; padding:1rem; border-radius:8px; font-weight:600;">
      ❌ This link is invalid or has expired. Please ask an admin to resend your invite.
    </p>
  </div>
</div>

<script>
  const SUPABASE_URL      = CONFIG.SUPABASE_URL;
  const SUPABASE_ANON_KEY = CONFIG.SUPABASE_ANON_KEY;

  let sessionToken = null;

  // Parse the URL fragment — Supabase puts the token in the hash
  function parseFragment() {
    const hash = window.location.hash.substring(1); // strip leading #
    const params = new URLSearchParams(hash);
    return {
      accessToken: params.get('access_token'),
      type:        params.get('type'),   // "recovery" or "invite"
    };
  }

  async function init() {
    const { accessToken, type } = parseFragment();

    if (!accessToken || (type !== 'recovery' && type !== 'invite')) {
      show('errorState');
      return;
    }

    // Exchange the recovery token for a usable session
    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
        headers: {
          'apikey':        SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${accessToken}`,
        }
      });

      if (!res.ok) throw new Error('Token rejected');

      // Token is good — store it so we can use it to update the password
      sessionToken = accessToken;
      show('formState');
    } catch (err) {
      show('errorState');
    }
  }

  async function setPassword() {
    const pwd1   = document.getElementById('newPassword').value;
    const pwd2   = document.getElementById('confirmPassword').value;
    const msg    = document.getElementById('formMsg');
    const btn    = document.getElementById('submitBtn');

    msg.className = 'msg';

    if (!pwd1 || pwd1.length < 8) {
      msg.textContent = 'Password must be at least 8 characters.';
      msg.className = 'msg error';
      return;
    }
    if (pwd1 !== pwd2) {
      msg.textContent = 'Passwords do not match.';
      msg.className = 'msg error';
      return;
    }

    btn.disabled    = true;
    btn.textContent = 'Saving…';

    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
        method: 'PUT',
        headers: {
          'Content-Type':  'application/json',
          'apikey':        SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${sessionToken}`,
        },
        body: JSON.stringify({ password: pwd1 })
      });

      if (!res.ok) {
        const data = await res.json();
        throw new Error(data.msg || data.message || 'Failed to update password');
      }

      show('successState');
    } catch (err) {
      msg.textContent = err.message;
      msg.className   = 'msg error';
      btn.disabled    = false;
      btn.textContent = 'Set Password';
    }
  }

  function show(id) {
    ['loadingState', 'formState', 'successState', 'errorState']
      .forEach(s => document.getElementById(s).style.display = s === id ? '' : 'none');
  }

  // Allow Enter key on confirm field
  document.getElementById('confirmPassword')?.addEventListener('keydown', e => {
    if (e.key === 'Enter') setPassword();
  });

  init();
</script>
</body>
</html>
