<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Now Serving — People Helping Pets</title>
  <script src="config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Bebas Neue', sans-serif;
      background: #0f2460;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(74,108,192,0.45) 0%, transparent 65%),
        radial-gradient(ellipse 50% 40% at 50% 110%, rgba(242,139,130,0.15) 0%, transparent 60%);
      pointer-events: none;
    }

    .brand {
      position: fixed;
      top: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: clamp(0.85rem, 2vw, 1.1rem);
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .main {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0;
      z-index: 1;
    }

    .now-label {
      font-size: clamp(1.5rem, 4vw, 3rem);
      letter-spacing: 0.4em;
      color: #f28b82;
      margin-bottom: 0rem;
    }

    .number-wrap {
      display: flex;
      align-items: baseline;
      gap: 0.1em;
      line-height: 1;
    }

    .hash {
      font-size: clamp(5rem, 15vw, 12rem);
      color: rgba(255,255,255,0.4);
      line-height: 1;
    }

    .now-number {
      font-size: clamp(7rem, 18vw, 14rem);
      line-height: 0.9;
      color: #ffffff;
      letter-spacing: 0.02em;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: scale(0.88); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }

    .divider {
      width: 40%;
      height: 2px;
      background: rgba(255,255,255,0.08);
      margin: 1rem 0 1.5rem;
    }

    .up-next-label {
      font-size: clamp(1rem, 2.5vw, 1.8rem);
      letter-spacing: 0.4em;
      color: rgba(255,255,255,0.3);
      margin-bottom: 1rem;
    }

    .next-numbers {
      display: flex;
      gap: clamp(1rem, 4vw, 4rem);
      align-items: center;
    }

    .next-num {
      font-size: clamp(3.5rem, 9vw, 7rem);
      color: rgba(255,255,255,0.2);
      line-height: 1;
    }

    .pulse-dot {
      position: fixed;
      bottom: 1.5rem;
      right: 2rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.15);
      letter-spacing: 0.08em;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #f28b82;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.3; transform: scale(0.6); }
    }

    .paw {
      position: fixed;
      bottom: 1.5rem;
      left: 2rem;
      font-size: 1.5rem;
      opacity: 0.1;
    }
  </style>
</head>
<body>

  <div class="brand">🐾 People Helping Pets — Vaccine Clinic</div>

  <div class="main">
    <div class="now-label">Now Serving</div>
    <div class="now-number" id="nowNumber">—</div>

    <div class="divider"></div>

    <div class="up-next-label">Up Next</div>
    <div class="next-numbers" id="nextNumbers">
      <div class="next-num">—</div>
    </div>
  </div>

  <div class="paw">🐾</div>
  <div class="pulse-dot"><div class="dot"></div>LIVE</div>

  <script>
    const SUPABASE_URL      = CONFIG.SUPABASE_URL;
    const SUPABASE_ANON_KEY = CONFIG.SUPABASE_ANON_KEY;

    let lastNumber = null;

    async function refresh() {
      try {
        const res  = await fetch(`${SUPABASE_URL}/rest/v1/queue_state?id=eq.1&select=now_serving`, {
          headers: {
            'apikey':        SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Accept':        'application/json'
          }
        });
        const [row] = await res.json();
        if (!row) return;

        const n = row.now_serving;

        if (n !== lastNumber) {
          const el = document.getElementById('nowNumber');
          el.style.animation = 'none';
          el.offsetHeight;
          el.style.animation = 'popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
          lastNumber = n;
        }

        document.getElementById('nowNumber').textContent = `#${n} – #${n+2}`;
        document.getElementById('nextNumbers').innerHTML =
          [n + 3, n + 4, n + 5].map(x => `<div class="next-num">#${x}</div>`).join('');
      } catch (err) {
        console.error('Display refresh error:', err);
      }
    }

    refresh();
    setInterval(refresh, 10000);
  </script>
</body>
</html>
