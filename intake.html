<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vaccine Clinic Intake / Registro de Clínica de Vacunas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green: #2d6a4f;
      --green-light: #d8f3dc;
      --green-mid: #52b788;
      --amber: #e07a00;
      --text: #1b1b1b;
      --text-muted: #555;
      --border: #ccc;
      --bg: #f7f9f6;
      --white: #fff;
      --radius: 10px;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--green);
      color: white;
      padding: 2rem 1.5rem 1.5rem;
      text-align: center;
    }

    header h1 {
      font-family: 'Fraunces', serif;
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 600;
      line-height: 1.3;
    }

    header p {
      margin-top: 0.5rem;
      font-size: 0.95rem;
      opacity: 0.85;
      font-style: italic;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    .section-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.75rem 1.5rem;
      margin-bottom: 1.5rem;
    }

    .section-title {
      font-family: 'Fraunces', serif;
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--green);
      margin-bottom: 1.25rem;
      padding-bottom: 0.6rem;
      border-bottom: 2px solid var(--green-light);
    }

    .field { margin-bottom: 1.1rem; }

    label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }

    label .es {
      font-weight: 400;
      color: var(--text-muted);
      font-style: italic;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="number"],
    select {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border: 1.5px solid var(--border);
      border-radius: 7px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      background: #fafafa;
      transition: border-color 0.15s, box-shadow 0.15s;
      appearance: none;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--green-mid);
      box-shadow: 0 0 0 3px rgba(82,183,136,0.2);
      background: var(--white);
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
    }

    @media (max-width: 480px) {
      .field-row { grid-template-columns: 1fr; }
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 0.2rem;
    }

    .checkbox-row input[type="checkbox"] {
      width: 18px; height: 18px;
      accent-color: var(--green);
      cursor: pointer;
      flex-shrink: 0;
    }

    .checkbox-row label {
      margin-bottom: 0;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .pet-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .pet-tab {
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 2px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }

    .pet-tab.active {
      border-color: var(--green);
      background: var(--green);
      color: white;
    }

    .pet-tab:hover:not(.active) {
      border-color: var(--green-mid);
      color: var(--green);
    }

    .add-pet-btn {
      background: none;
      border: 2px dashed var(--green-mid);
      color: var(--green);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .add-pet-btn:hover { background: var(--green-light); }

    .pet-panel { display: none; }
    .pet-panel.active { display: block; }

    .submit-area { text-align: center; margin-top: 0.5rem; }

    .btn-submit {
      background: var(--green);
      color: white;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.85rem 2.5rem;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 4px 16px rgba(45,106,79,0.3);
    }

    .btn-submit:hover { background: #245a42; }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .submit-note {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.75rem;
      font-style: italic;
      line-height: 1.5;
    }

    .status {
      display: none;
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.5;
      white-space: pre-line;
    }

    .status.success {
      display: block;
      background: var(--green-light);
      border: 1.5px solid var(--green-mid);
      color: var(--green);
    }

    .status.error {
      display: block;
      background: #fff0f0;
      border: 1.5px solid #f4a0a0;
      color: #a00;
    }

    .required { color: var(--amber); margin-left: 2px; }
  </style>
</head>
<body>

<header>
  <h1>🐾 Free Vaccine Clinic Registration<br>
  <span style="font-weight:400; font-size:0.85em; font-style:italic">Registro para Clínica de Vacunas Gratuita</span></h1>
  <p>People Helping Pets — Chicago</p>
</header>

<main>
  <div id="statusBanner" class="status" role="alert"></div>

  <form id="intakeForm" novalidate>

    <!-- CLIENT SECTION -->
    <div class="section-card">
      <div class="section-title">👤 Your Information / Su Información</div>

      <div class="field">
        <label>Full Name / <span class="es">Nombre Completo</span> <span class="required">*</span></label>
        <input type="text" name="name" placeholder="Jane Smith" />
      </div>

      <div class="field-row">
        <div class="field">
          <label>Email / <span class="es">Correo Electrónico</span></label>
          <input type="email" name="email" placeholder="correo@ejemplo.com" />
        </div>
        <div class="field">
          <label>Phone / <span class="es">Teléfono</span></label>
          <input type="tel" name="phone" placeholder="(773) 555-0100" />
        </div>
      </div>

      <div class="field">
        <label>Address / <span class="es">Dirección</span></label>
        <input type="text" name="address" placeholder="1234 W Cermak Rd, Chicago, IL 60608" />
      </div>
    </div>

    <!-- PET SECTION -->
    <div class="section-card">
      <div class="section-title">🐾 Your Pets / Sus Mascotas</div>

      <div class="pet-tabs" id="petTabs">
        <button type="button" class="pet-tab active" data-pet="0">Pet 1 / Mascota 1</button>
        <button type="button" class="add-pet-btn" id="addPetBtn">+ Add pet / Agregar mascota</button>
      </div>

      <!-- Pet panels -->
      <div class="pet-panel active" id="petPanel0" data-index="0"></div>
      <div class="pet-panel" id="petPanel1" data-index="1"></div>
      <div class="pet-panel" id="petPanel2" data-index="2"></div>
    </div>

    <div class="submit-area">
      <button type="submit" class="btn-submit" id="submitBtn">
        Submit Registration / Enviar Registro
      </button>
      <p class="submit-note">
        Your information is used only to coordinate your visit.<br>
        <em>Su información se usa solo para coordinar su visita.</em>
      </p>
    </div>

  </form>
</main>

<script>
  // ─── CONFIG ────────────────────────────────────────────────────
  // Replace these with your values from Supabase → Settings → API
  const SUPABASE_URL = 'https://lzfhdzklfmmxbfmyscfl.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6ZmhkemtsZm1teGJmbXlzY2ZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MzA4MTAsImV4cCI6MjA4OTUwNjgxMH0.3nDc8afk-_ufnSQ4ozKCdaYheMZkm6qjNf9ibyo03uk';

  // ─── SUPABASE HELPER ───────────────────────────────────────────
  // We're using Supabase's REST API directly — no SDK needed for simple inserts.
  // 'Prefer: return=representation' tells Supabase to return the created row(s),
  // which is how we get back the new client's id to link pets to it.
  async function supabaseInsert(table, data) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Prefer': 'return=representation'
      },
      body: JSON.stringify(data)
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || `Insert to ${table} failed (${res.status})`);
    }
    return res.json();
  }

  // ─── BUILD PET FIELDS ──────────────────────────────────────────
  // Dynamically render pet form fields so we don't repeat HTML three times.
  function buildPetPanel(i) {
    const panel = document.getElementById(`petPanel${i}`);
    panel.innerHTML = `
      <div class="field-row">
        <div class="field">
          <label>Pet Name / <span class="es">Nombre</span> ${i === 0 ? '<span class="required">*</span>' : ''}</label>
          <input type="text" name="pet_name_${i}" placeholder="${['Fido','Luna','Mochi'][i]}" />
        </div>
        <div class="field">
          <label>Species / <span class="es">Especie</span> ${i === 0 ? '<span class="required">*</span>' : ''}</label>
          <select name="pet_species_${i}">
            <option value="">— Select / Seleccionar —</option>
            <option value="dog">Dog / Perro</option>
            <option value="cat">Cat / Gato</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Breed / <span class="es">Raza</span></label>
          <input type="text" name="pet_breed_${i}" placeholder="Mixed / Mestizo" />
        </div>
        <div class="field">
          <label>Age (yrs) / <span class="es">Edad (años)</span></label>
          <input type="number" name="pet_age_${i}" min="0" max="30" step="0.5" placeholder="2" />
        </div>
      </div>
      <div class="field">
        <label>Weight (lbs) / <span class="es">Peso (libras)</span></label>
        <input type="number" name="pet_weight_${i}" min="0" step="0.1" placeholder="25" />
      </div>
      <div class="checkbox-row">
        <input type="checkbox" name="pet_sn_${i}" id="sn${i}" />
        <label for="sn${i}">Spayed / Neutered &nbsp;·&nbsp; <span class="es">Esterilizado/a</span></label>
      </div>
    `;
  }

  // Build all three panels on load
  [0, 1, 2].forEach(buildPetPanel);

  // ─── PET TAB LOGIC ─────────────────────────────────────────────
  let petCount = 1;

  function showPet(index) {
    document.querySelectorAll('.pet-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.pet-tab').forEach(t => t.classList.remove('active'));
    document.getElementById(`petPanel${index}`).classList.add('active');
    document.querySelector(`[data-pet="${index}"]`).classList.add('active');
  }

  document.getElementById('petTabs').addEventListener('click', (e) => {
    if (e.target.matches('.pet-tab')) showPet(+e.target.dataset.pet);
  });

  document.getElementById('addPetBtn').addEventListener('click', () => {
    if (petCount >= 3) return;
    const idx = petCount;
    const tab = document.createElement('button');
    tab.type = 'button';
    tab.className = 'pet-tab';
    tab.dataset.pet = idx;
    tab.textContent = `Pet ${idx + 1} / Mascota ${idx + 1}`;
    const addBtn = document.getElementById('addPetBtn');
    document.getElementById('petTabs').insertBefore(tab, addBtn);
    petCount++;
    if (petCount >= 3) addBtn.style.display = 'none';
    showPet(idx);
  });

  // ─── FORM SUBMIT ───────────────────────────────────────────────
  const form = document.getElementById('intakeForm');
  const submitBtn = document.getElementById('submitBtn');
  const statusBanner = document.getElementById('statusBanner');

  function showStatus(type, msg) {
    statusBanner.className = `status ${type}`;
    statusBanner.textContent = msg;
    statusBanner.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(form);

    // Validate required fields
    if (!fd.get('name')?.trim()) {
      return showStatus('error', 'Please enter your name.\nPor favor ingrese su nombre.');
    }
    if (!fd.get('pet_name_0')?.trim()) {
      return showStatus('error', 'Please enter at least one pet\'s name.\nIngrese el nombre de al menos una mascota.');
    }
    if (!fd.get('pet_species_0')) {
      return showStatus('error', 'Please select a species for Pet 1.\nSeleccione la especie de la Mascota 1.');
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting… / Enviando…';
    statusBanner.className = 'status';  // hide previous status

    try {
      // Step 1: Insert the client row. Returns the new row including its generated id.
      const [client] = await supabaseInsert('clients', {
        name: fd.get('name').trim(),
        email: fd.get('email')?.trim() || null,
        phone: fd.get('phone')?.trim() || null,
        address: fd.get('address')?.trim() || null
      });

      // Step 2: Build pet rows. We skip any slot where the name is blank.
      // This handles the case where someone only has 1 or 2 pets but we rendered 3 slots.
      const pets = [];
      for (let i = 0; i < 3; i++) {
        const name = fd.get(`pet_name_${i}`)?.trim();
        if (!name) continue;
        pets.push({
          client_id: client.id,
          name,
          species: fd.get(`pet_species_${i}`) || null,
          breed: fd.get(`pet_breed_${i}`)?.trim() || null,
          age: fd.get(`pet_age_${i}`) ? +fd.get(`pet_age_${i}`) : null,
          weight: fd.get(`pet_weight_${i}`) ? +fd.get(`pet_weight_${i}`) : null,
          spayed_neutered: fd.get(`pet_sn_${i}`) === 'on'
        });
      }

      // Supabase accepts an array — it inserts all pets in one request.
      if (pets.length) await supabaseInsert('pets', pets);

      form.reset();
      showStatus('success',
        '✅ Registration complete! We\'ll see you at the clinic.\n✅ ¡Registro completo! Lo veremos en la clínica.'
      );
      submitBtn.textContent = 'Submitted ✓ / Enviado ✓';

    } catch (err) {
      console.error(err);
      showStatus('error',
        `Something went wrong: ${err.message}\nAlgo salió mal. Por favor intente de nuevo.`
      );
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit Registration / Enviar Registro';
    }
  });
</script>
</body>
</html>
