<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pawkit — Staff</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy:        #1a3a8f;
      --navy-dark:   #122a6e;
      --navy-mid:    #4a6cc0;
      --navy-light:  #dce6f9;
      --coral:       #f28b82;
      --coral-dark:  #d96b62;
      --coral-light: #fde8e6;
      --green:       #2d8a5e;
      --green-light: #d4f0e4;
      --amber:       #d97706;
      --amber-light: #fef3c7;
      --text:        #1a1a2e;
      --text-muted:  #5a6380;
      --border:      #c8d3ec;
      --bg:          #f4f7fe;
      --white:       #ffffff;
      --radius:      12px;
      --shadow:      0 2px 16px rgba(26,58,143,0.10);
      --shadow-lg:   0 8px 32px rgba(26,58,143,0.15);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Nav ── */
    .topnav {
      background: var(--navy);
      color: white;
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 12px rgba(26,58,143,0.2);
    }

    .topnav-brand {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1.05rem;
    }

    .topnav-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .user-label {
      font-size: 0.8rem;
      opacity: 0.8;
    }

    .btn-signout {
      background: rgba(255,255,255,0.15);
      color: white;
      font-family: 'Nunito', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 0.35rem 0.9rem;
      border: 1.5px solid rgba(255,255,255,0.3);
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-signout:hover { background: rgba(255,255,255,0.25); }

    /* ── Page layout ── */
    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    .section-title {
      font-family: 'Nunito', sans-serif;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.85rem;
    }

    /* ── Nav tiles ── */
    .nav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .nav-tile {
      display: block;
      background: var(--white);
      border: 1.5px solid rgba(26,58,143,0.07);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.4rem 1.25rem;
      text-decoration: none;
      color: var(--text);
      transition: box-shadow 0.15s, border-color 0.15s, transform 0.1s;
    }

    .nav-tile:hover {
      box-shadow: var(--shadow-lg);
      border-color: var(--navy);
      transform: translateY(-2px);
    }

    .nav-tile-icon {
      font-size: 1.75rem;
      margin-bottom: 0.6rem;
    }

    .nav-tile-label {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--navy);
      margin-bottom: 0.2rem;
    }

    .nav-tile-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* ── Card ── */
    .card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1.5px solid rgba(26,58,143,0.07);
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .card-header {
      background: var(--navy-light);
      padding: 0.9rem 1.25rem;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--navy);
      border-bottom: 1.5px solid var(--border);
    }

    .card-body { padding: 1.25rem; }

    /* ── Form ── */
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    @media (max-width: 500px) {
      .form-row { grid-template-columns: 1fr; }
    }

    .form-field { margin-bottom: 0.9rem; }

    .form-field label {
      display: block;
      font-size: 0.83rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .form-field input,
    .form-field select {
      width: 100%;
      padding: 0.55rem 0.8rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: 'Nunito Sans', sans-serif;
      font-size: 0.9rem;
      color: var(--text);
      background: #f8faff;
      transition: border-color 0.15s, box-shadow 0.15s;
      appearance: none;
    }

    .form-field input:focus,
    .form-field select:focus {
      outline: none;
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(26,58,143,0.12);
      background: var(--white);
    }

    .btn {
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 0.55rem 1.3rem;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--navy); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--navy-dark); }
    .btn-sm { font-size: 0.78rem; padding: 0.3rem 0.8rem; }

    .msg {
      font-size: 0.83rem;
      margin-top: 0.75rem;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      display: none;
    }
    .msg.success { display: block; background: var(--green-light); color: var(--green); }
    .msg.error   { display: block; background: var(--coral-light); color: var(--coral-dark); }

    /* ── User table ── */
    .user-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    .user-table th {
      text-align: left;
      font-family: 'Nunito', sans-serif;
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--text-muted);
      padding: 0.5rem 0.75rem;
      border-bottom: 1.5px solid var(--border);
    }

    .user-table td {
      padding: 0.65rem 0.75rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .user-table tr:last-child td { border-bottom: none; }
    .user-table tr:hover td { background: var(--navy-light); }

    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
    }

    .badge-staff     { background: var(--navy-light); color: var(--navy); }
    .badge-volunteer { background: var(--amber-light); color: var(--amber); }

    .empty-state {
      text-align: center;
      padding: 1.5rem;
      color: var(--text-muted);
      font-style: italic;
      font-size: 0.88rem;
    }
  </style>
</head>
<body>

  <!-- ── Nav ── -->
  <nav class="topnav">
    <div class="topnav-brand">🐾 Pawkit — Staff</div>
    <div class="topnav-right">
      <span class="user-label" id="userLabel"></span>
      <button class="btn-signout" onclick="signOut()">Sign Out</button>
    </div>
  </nav>

  <div class="page">

    <!-- ── Navigation tiles ── -->
    <p class="section-title">Tools</p>
    <div class="nav-grid">
      <a href="intake-staff.html" class="nav-tile">
        <div class="nav-tile-icon">🏥</div>
        <div class="nav-tile-label">Intake</div>
        <div class="nav-tile-sub">Register clients &amp; check in</div>
      </a>
      <a href="discharge-staff.html" class="nav-tile">
        <div class="nav-tile-icon">💉</div>
        <div class="nav-tile-label">Discharge</div>
        <div class="nav-tile-sub">Log vaccines &amp; microchips</div>
      </a>
      <a href="roster.html" class="nav-tile">
        <div class="nav-tile-icon">📋</div>
        <div class="nav-tile-label">Roster</div>
        <div class="nav-tile-sub">View &amp; export clinic records</div>
      </a>
      <a href="client.html" class="nav-tile">
        <div class="nav-tile-icon">👤</div>
        <div class="nav-tile-label">Client Profiles</div>
        <div class="nav-tile-sub">Search &amp; edit client records</div>
      </a>
      <a href="stats.html" class="nav-tile">
        <div class="nav-tile-icon">📊</div>
        <div class="nav-tile-label">Reports</div>
        <div class="nav-tile-sub">Stats &amp; grant reporting</div>
      </a>
    </div>

    <!-- ── User management ── -->
    <p class="section-title">User Management</p>

    <!-- Invite new user -->
    <div class="card">
      <div class="card-header">➕ Invite New User</div>
      <div class="card-body">
        <div class="form-row">
          <div class="form-field">
            <label>Email</label>
            <input type="email" id="inviteEmail" placeholder="volunteer@example.com" />
          </div>
          <div class="form-field">
            <label>Role</label>
            <select id="inviteRole">
              <option value="volunteer">Volunteer</option>
              <option value="staff">Staff</option>
            </select>
          </div>
        </div>
        <button class="btn btn-primary" id="inviteBtn" onclick="inviteUser()">Send Invite</button>
        <div class="msg" id="inviteMsg"></div>
      </div>
    </div>

    <!-- Existing users -->
    <div class="card">
      <div class="card-header">👥 All Users</div>
      <div class="card-body" style="padding:0;">
        <div id="userTableWrap">
          <div class="empty-state">Loading users…</div>
        </div>
      </div>
    </div>

  </div><!-- /page -->

  <script>
    const SUPABASE_URL = CONFIG?.SUPABASE_URL;

    // ── Auth guard ────────────────────────────────────────────────
    const token = localStorage.getItem('php_token');
    if (!token) window.location.href = 'dashboard.html';

    // Guard: make sure this is actually a staff user
    function getRoleFromToken(t) {
      try {
        return JSON.parse(atob(t.split('.')[1])).app_metadata?.role || 'volunteer';
      } catch { return 'volunteer'; }
    }
    if (getRoleFromToken(token) !== 'staff') window.location.href = 'volunteer-home.html';

    // ── Show email ────────────────────────────────────────────────
    const email = localStorage.getItem('php_email');
    if (email) document.getElementById('userLabel').textContent = `👋 ${email}`;

    // ── Sign out ──────────────────────────────────────────────────
    function signOut() {
      localStorage.removeItem('php_token');
      localStorage.removeItem('php_email');
      window.location.href = 'dashboard.html';
    }

    // ── Show message ──────────────────────────────────────────────
    function showMsg(id, type, text) {
      const el = document.getElementById(id);
      el.className = `msg ${type}`;
      el.textContent = text;
      setTimeout(() => el.className = 'msg', 5000);
    }

    // ── Invite user ───────────────────────────────────────────────
    async function inviteUser() {
      const email = document.getElementById('inviteEmail').value.trim();
      const role  = document.getElementById('inviteRole').value;
      const btn   = document.getElementById('inviteBtn');

      if (!email) { showMsg('inviteMsg', 'error', 'Please enter an email address.'); return; }

      btn.disabled = true;
      btn.textContent = 'Sending…';

      try {
        const res = await fetch('/api/admin-users', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ action: 'invite', email, role })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Invite failed');
        showMsg('inviteMsg', 'success', `Invite sent to ${email}.`);
        document.getElementById('inviteEmail').value = '';
        loadUsers();
      } catch (err) {
        showMsg('inviteMsg', 'error', err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Invite';
      }
    }

    // ── Change role ───────────────────────────────────────────────
    async function changeRole(userId, newRole) {
      try {
        const res = await fetch('/api/admin-users', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ action: 'set_role', userId, role: newRole })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Role update failed');
        loadUsers();
      } catch (err) {
        alert('Could not update role: ' + err.message);
      }
    }

    // ── Load & render users ───────────────────────────────────────
    async function loadUsers() {
      const wrap = document.getElementById('userTableWrap');
      wrap.innerHTML = '<div class="empty-state">Loading…</div>';
      try {
        const res = await fetch('/api/admin-users?action=list', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not load users');

        const users = data.users;
        if (!users.length) {
          wrap.innerHTML = '<div class="empty-state">No users found.</div>';
          return;
        }

        const myEmail = localStorage.getItem('php_email');

        wrap.innerHTML = `
          <table class="user-table">
            <thead>
              <tr>
                <th>Email</th>
                <th>Role</th>
                <th>Joined</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              ${users.map(u => {
                const role    = u.app_metadata?.role || 'volunteer';
                const joined  = u.created_at ? new Date(u.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
                const isMe    = u.email === myEmail;
                return `
                  <tr>
                    <td>${u.email}${isMe ? ' <span style="font-size:0.72rem;color:var(--text-muted)">(you)</span>' : ''}</td>
                    <td>
                      <span class="badge badge-${role}">${role}</span>
                    </td>
                    <td style="color:var(--text-muted)">${joined}</td>
                    <td style="white-space:nowrap; display:flex; gap:0.4rem;">
                      ${!isMe ? `
                        <select class="btn btn-sm" style="border:1.5px solid var(--border);background:#f8faff;color:var(--text);border-radius:8px;padding:0.25rem 0.5rem;" onchange="changeRole('${u.id}', this.value)">
                          <option value="volunteer" ${role === 'volunteer' ? 'selected' : ''}>Volunteer</option>
                          <option value="staff"     ${role === 'staff'     ? 'selected' : ''}>Staff</option>
                        </select>
                      ` : '<span style="font-size:0.78rem;color:var(--text-muted)">—</span>'}
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        `;
      } catch (err) {
        wrap.innerHTML = `<div class="empty-state" style="color:#a00">Error: ${err.message}</div>`;
      }
    }

    // Load users on page load
    loadUsers();
  </script>
  <script src="config.js"></script>
</body>
</html>
