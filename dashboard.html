<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Dashboard — People Helping Pets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy:        #1a3a8f;
      --navy-dark:   #122a6e;
      --navy-light:  #dce6f9;
      --navy-mid:    #4a6cc0;
      --coral:       #f28b82;
      --coral-light: #fde8e6;
      --coral-dark:  #d96b62;
      --green:       #2d8a5e;
      --green-light: #d4f0e4;
      --amber:       #d97706;
      --amber-light: #fef3c7;
      --text:        #1a1a2e;
      --text-muted:  #5a6380;
      --border:      #c8d3ec;
      --bg:          #f4f7fe;
      --white:       #ffffff;
      --radius:      12px;
      --shadow:      0 2px 16px rgba(26,58,143,0.10);
      --shadow-lg:   0 8px 32px rgba(26,58,143,0.15);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── SCREENS ── */
    .screen { display: none; }
    .screen.active { display: block; }

    /* ══════════════════════════════
       LOGIN SCREEN
    ══════════════════════════════ */
    #loginScreen {
      min-height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 60%, var(--navy-mid) 100%);
    }
    #loginScreen.active { display: flex; }

    .login-card {
      background: var(--white);
      border-radius: 20px;
      box-shadow: var(--shadow-lg);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      margin: 1rem;
    }

    .login-card h1 {
      font-family: 'Nunito', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--navy);
      text-align: center;
      margin-bottom: 0.25rem;
    }

    .login-card .subtitle {
      text-align: center;
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .login-field { margin-bottom: 1.1rem; }

    .login-field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
      color: var(--text);
    }

    .login-field input {
      width: 100%;
      padding: 0.65rem 0.9rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: 'Nunito Sans', sans-serif;
      font-size: 0.95rem;
      color: var(--text);
      background: #f8faff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .login-field input:focus {
      outline: none;
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(26,58,143,0.15);
      background: var(--white);
    }

    .btn-login {
      width: 100%;
      background: var(--navy);
      color: white;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      padding: 0.8rem;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 4px 16px rgba(26,58,143,0.3);
    }

    .btn-login:hover { background: var(--navy-dark); }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ══════════════════════════════
       DASHBOARD SCREEN
    ══════════════════════════════ */
    #dashScreen { min-height: 100vh; }

    /* Top nav */
    .topnav {
      background: var(--navy);
      color: white;
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 12px rgba(26,58,143,0.2);
    }

    .topnav-brand {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-logout {
      background: rgba(255,255,255,0.15);
      color: white;
      font-family: 'Nunito', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 0.35rem 0.9rem;
      border: 1.5px solid rgba(255,255,255,0.3);
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-logout:hover { background: rgba(255,255,255,0.25); }

    /* Main layout */
    .dash-body {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.75rem 1.25rem 4rem;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1.5rem;
      align-items: start;
    }

    @media (max-width: 700px) {
      .dash-body { grid-template-columns: 1fr; }
    }

    /* Cards */
    .card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1.5px solid rgba(26,58,143,0.07);
      overflow: hidden;
    }

    .card-header {
      background: var(--navy-light);
      padding: 0.9rem 1.25rem;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--navy);
      border-bottom: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .card-body { padding: 1.25rem; }

    /* Search */
    .search-wrap {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .search-wrap input {
      flex: 1;
      padding: 0.6rem 0.85rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: 'Nunito Sans', sans-serif;
      font-size: 0.92rem;
      color: var(--text);
      background: #f8faff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .search-wrap input:focus {
      outline: none;
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(26,58,143,0.12);
      background: var(--white);
    }

    .btn-search {
      background: var(--navy);
      color: white;
      font-family: 'Nunito', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 0.6rem 1.1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .btn-search:hover { background: var(--navy-dark); }

    /* Client list */
    .client-list { list-style: none; }

    .client-item {
      padding: 0.75rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.12s;
      border-bottom: 1px solid var(--border);
    }

    .client-item:last-child { border-bottom: none; }

    .client-item:hover { background: var(--navy-light); }
    .client-item.selected { background: var(--navy-light); border-left: 3px solid var(--navy); }

    .client-item .client-name {
      font-weight: 700;
      font-size: 0.92rem;
    }

    .client-item .client-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
    }

    .empty-state {
      text-align: center;
      padding: 1.5rem 1rem;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-style: italic;
    }

    /* Right panel */
    #detailPanel .card { margin-bottom: 1.25rem; }

    /* Pet cards */
    .pet-card {
      background: #f8faff;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem 1rem;
      margin-bottom: 0.85rem;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .pet-card:hover { border-color: var(--navy); }
    .pet-card.selected { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(26,58,143,0.1); }

    .pet-card-name {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      color: var(--navy);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .pet-card-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      background: var(--navy-light);
      color: var(--navy);
    }

    .badge.dog { background: #dbeafe; color: #1e40af; }
    .badge.cat { background: var(--coral-light); color: var(--coral-dark); }
    .badge.sn-yes { background: var(--green-light); color: var(--green); }
    .badge.sn-no { background: var(--amber-light); color: var(--amber); }

    /* Forms inside cards */
    .form-field { margin-bottom: 0.9rem; }

    .form-field label {
      display: block;
      font-size: 0.83rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      color: var(--text);
    }

    .form-field input,
    .form-field select,
    .form-field textarea {
      width: 100%;
      padding: 0.55rem 0.8rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: 'Nunito Sans', sans-serif;
      font-size: 0.9rem;
      color: var(--text);
      background: #f8faff;
      transition: border-color 0.15s, box-shadow 0.15s;
      appearance: none;
    }

    .form-field input:focus,
    .form-field select:focus {
      outline: none;
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(26,58,143,0.12);
      background: var(--white);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    @media (max-width: 500px) {
      .form-row { grid-template-columns: 1fr; }
    }

    .btn-primary {
      background: var(--navy);
      color: white;
      font-family: 'Nunito', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 0.6rem 1.4rem;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-primary:hover { background: var(--navy-dark); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-coral {
      background: var(--coral);
      color: white;
      font-family: 'Nunito', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 0.6rem 1.4rem;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-coral:hover { background: var(--coral-dark); }
    .btn-coral:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Vaccine history table */
    .vax-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
    }

    .vax-table th {
      text-align: left;
      padding: 0.5rem 0.75rem;
      background: var(--navy-light);
      color: var(--navy);
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .vax-table td {
      padding: 0.6rem 0.75rem;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }

    .vax-table tr:last-child td { border-bottom: none; }
    .vax-table tr:hover td { background: #f8faff; }

    /* Status messages */
    .msg {
      padding: 0.65rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      display: none;
    }

    .msg.success { display: block; background: var(--green-light); color: var(--green); border: 1px solid #86efac; }
    .msg.error   { display: block; background: var(--coral-light); color: #8b1a14; border: 1px solid var(--coral); }

    /* Collapsible sections */
    .section-toggle {
      width: 100%;
      background: none;
      border: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
    }

    .toggle-icon { font-size: 0.85rem; transition: transform 0.2s; }
    .toggle-icon.open { transform: rotate(180deg); }

    .collapsible { display: none; margin-top: 1rem; }
    .collapsible.open { display: block; }
  </style>
</head>

        </div>
        <div class="card-body collapsible open" id="petsSection">
          <div id="petList"></div>

          <!-- Add pet toggle -->
          <button class="section-toggle" style="margin-top:0.5rem"
            onclick="toggleSection('addPetForm', 'addPetIcon')">
            <span style="font-size:0.85rem; font-weight:700; color:var(--navy)">+ Add a pet</span>
            <span class="toggle-icon" id="addPetIcon">▼</span>
          </button>

          <div class="collapsible" id="addPetForm" style="margin-top:0.75rem">
            <div id="addPetMsg" class="msg"></div>
            <div class="form-row">
              <div class="form-field">
                <label>Pet Name *</label>
                <input type="text" id="newPetName" placeholder="Fido" />
              </div>
              <div class="form-field">
                <label>Species *</label>
                <select id="newPetSpecies">
                  <option value="">— Select —</option>
                  <option value="dog">Dog</option>
                  <option value="cat">Cat</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <div class="form-field">
                <label>Breed</label>
                <input type="text" id="newPetBreed" placeholder="Mixed" />
              </div>
              <div class="form-field">
                <label>Age (yrs)</label>
                <input type="number" id="newPetAge" min="0" max="30" step="0.5" placeholder="2" />
              </div>
            </div>
            <div class="form-row">
              <div class="form-field">
                <label>Weight (lbs)</label>
                <input type="number" id="newPetWeight" min="0" step="0.1" placeholder="25" />
              </div>
              <div class="form-field">
                <label>Spayed / Neutered</label>
                <select id="newPetSN">
                  <option value="unknown">Not sure</option>
                  <option value="yes">Yes</option>
                  <option value="no">No</option>
                </select>
              </div>
            </div>
            <button class="btn-primary" onclick="addPet()">Save Pet</button>
          </div>
        </div>
      </div>

      <!-- Vaccine log section -->
      <div class="card" id="vaxCard" style="display:none">
        <div class="card-header">
          <button class="section-toggle" onclick="toggleSection('vaxSection', 'vaxToggleIcon')">
            <span>💉 Log a Vaccine</span>
            <span class="toggle-icon open" id="vaxToggleIcon">▼</span>
          </button>
        </div>
        <div class="card-body collapsible open" id="vaxSection">
          <p style="font-size:0.83rem; color:var(--text-muted); margin-bottom:0.85rem">
            Select a pet above, then fill in vaccine details.
          </p>
          <div id="selectedPetBadge" style="margin-bottom:0.85rem; display:none">
            Logging for: <strong id="selectedPetName"></strong>
            <button onclick="clearSelectedPet()"
              style="margin-left:0.5rem; font-size:0.75rem; color:var(--coral-dark); background:none; border:none; cursor:pointer;">✕ clear</button>
          </div>
          <div id="logVaxMsg" class="msg"></div>
          <div class="form-row">
            <div class="form-field">
              <label>Vaccine Name *</label>
              <select id="vaxName">
                <option value="">— Select —</option>
                <option value="Rabies">Rabies</option>
                <option value="DHPP">DHPP (Dog)</option>
                <option value="Bordetella">Bordetella (Dog)</option>
                <option value="FVRCP">FVRCP (Cat)</option>
                <option value="FeLV">FeLV (Cat)</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="form-field">
              <label>Other (if selected above)</label>
              <input type="text" id="vaxNameOther" placeholder="Vaccine name" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-field">
              <label>Date Given *</label>
              <input type="date" id="vaxDate" />
            </div>
            <div class="form-field">
              <label>Next Due</label>
              <input type="date" id="vaxNextDue" />
            </div>
          </div>
          <div class="form-field">
            <label>Administered By</label>
            <input type="text" id="vaxAdmin" placeholder="Dr. Garcia" />
          </div>
          <button class="btn-coral" onclick="logVaccine()" id="logVaxBtn" disabled>Log Vaccine</button>
        </div>
      </div>

      <!-- Vaccination history -->
      <div class="card" id="historyCard" style="display:none">
        <div class="card-header">
          <button class="section-toggle" onclick="toggleSection('historySection', 'histToggleIcon')">
            <span>📋 Vaccination History</span>
            <span class="toggle-icon open" id="histToggleIcon">▼</span>
          </button>
        </div>
        <div class="card-body collapsible open" id="historySection">
          <div id="vaxHistoryContent">
            <div class="empty-state">Select a pet above to view its history.</div>
          </div>
        </div>
      </div>

    </div><!-- /detailPanel -->
  </div><!-- /dash-body -->
</div><!-- /dashScreen -->

<script>
  // ─── CONFIG ────────────────────────────────────────────────────
  const SUPABASE_URL = 'https://lzfhdzklfmmxbfmyscfl.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6ZmhkemtsZm1teGJmbXlzY2ZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MzA4MTAsImV4cCI6MjA4OTUwNjgxMH0.3nDc8afk-_ufnSQ4ozKCdaYheMZkm6qjNf9ibyo03uk';

  // ─── STATE ─────────────────────────────────────────────────────
  let accessToken    = null;
  let currentClient  = null;
  let selectedPetId  = null;
  let selectedPetObj = null;

  // ─── SUPABASE HELPERS ──────────────────────────────────────────
  function authHeaders() {
    return {
      'Content-Type':  'application/json',
      'apikey':        SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${accessToken || SUPABASE_ANON_KEY}`
    };
  }

  async function sbGet(path) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers: { ...authHeaders(), 'Accept': 'application/json' }
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).message || res.statusText);
    return res.json();
  }

  async function sbPost(table, data) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
      method: 'POST',
      headers: { ...authHeaders(), 'Prefer': 'return=representation' },
      body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).message || res.statusText);
    return res.json();
  }

  // ─── AUTH ──────────────────────────────────────────────────────
  async function login() {
    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const btn      = document.getElementById('loginBtn');
    const msg      = document.getElementById('loginMsg');

    if (!email || !password) {
      showMsg(msg, 'error', 'Please enter your email and password.');
      return;
    }

    btn.disabled    = true;
    btn.textContent = 'Signing in…';
    msg.className   = 'msg';

    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
        body:    JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error_description || data.msg || 'Login failed');

      accessToken = data.access_token;
      showScreen('dashScreen');
    } catch (err) {
      showMsg(msg, 'error', err.message);
      btn.disabled    = false;
      btn.textContent = 'Sign In';
    }
  }

  function logout() {
    accessToken   = null;
    currentClient = null;
    selectedPetId = null;
    document.getElementById('clientList').innerHTML = '<li class="empty-state">Search to find a client.</li>';
    document.getElementById('searchInput').value = '';
    resetDetailPanel();
    showScreen('loginScreen');
  }

  // Allow Enter key on password field
  document.getElementById('loginPassword').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });

  // ─── SCREEN MANAGEMENT ─────────────────────────────────────────
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // ─── SEARCH ────────────────────────────────────────────────────
  async function searchClients() {
    const q    = document.getElementById('searchInput').value.trim();
    const list = document.getElementById('clientList');
    if (!q) { list.innerHTML = '<li class="empty-state">Enter a name, email, or phone.</li>'; return; }

    list.innerHTML = '<li class="empty-state">Searching…</li>';

    try {
      // Search across name, email, and phone using ilike (case-insensitive)
      const encoded = encodeURIComponent(`%${q}%`);
      const clients = await sbGet(
        `clients?or=(name.ilike.${encoded},email.ilike.${encoded},phone.ilike.${encoded})&order=name.asc&limit=30`
      );

      if (!clients.length) {
        list.innerHTML = '<li class="empty-state">No clients found.</li>';
        return;
      }

      list.innerHTML = clients.map(c => `
        <li class="client-item" onclick="selectClient(${JSON.stringify(c).replace(/"/g,'&quot;')})">
          <div class="client-name">${c.name}</div>
          <div class="client-meta">${[c.phone, c.email].filter(Boolean).join(' · ') || 'No contact info'}</div>
        </li>
      `).join('');
    } catch (err) {
      list.innerHTML = `<li class="empty-state" style="color:#a00">Error: ${err.message}</li>`;
    }
  }

  // ─── CLIENT DETAIL ─────────────────────────────────────────────
  async function selectClient(client) {
    currentClient  = client;
    selectedPetId  = null;
    selectedPetObj = null;

    // Highlight selected in list
    document.querySelectorAll('.client-item').forEach(el => el.classList.remove('selected'));
    event.currentTarget.classList.add('selected');

    // Show client info
    document.getElementById('detailEmpty').style.display  = 'none';
    document.getElementById('clientInfo').style.display   = 'block';
    document.getElementById('clientName').textContent     = client.name;
    document.getElementById('clientContact').textContent  =
      [client.phone, client.email, client.address].filter(Boolean).join(' · ') || 'No contact info';
    document.getElementById('clientSince').textContent    =
      'Client since ' + new Date(client.created_at).toLocaleDateString('en-US', { month:'short', year:'numeric' });

    // Show cards
    ['petsCard','vaxCard','historyCard'].forEach(id => document.getElementById(id).style.display = 'block');

    // Reset vaccine section
    clearSelectedPet();
    document.getElementById('vaxHistoryContent').innerHTML = '<div class="empty-state">Select a pet above to view its history.</div>';

    // Load pets
    await loadPets(client.id);
  }

  async function loadPets(clientId) {
    const list = document.getElementById('petList');
    list.innerHTML = '<div class="empty-state">Loading…</div>';

    try {
      const pets = await sbGet(`pets?client_id=eq.${clientId}&order=name.asc`);
      if (!pets.length) {
        list.innerHTML = '<div class="empty-state">No pets on record yet.</div>';
        return;
      }

      list.innerHTML = pets.map(p => `
        <div class="pet-card" id="pet-${p.id}"
          onclick="selectPet(${JSON.stringify(p).replace(/"/g,'&quot;')})">
          <div class="pet-card-name">
            ${p.species === 'dog' ? '🐶' : p.species === 'cat' ? '🐱' : '🐾'}
            ${p.name}
            <span class="badge ${p.species || ''}">${p.species || '?'}</span>
            ${p.spayed_neutered === 'yes' ? '<span class="badge sn-yes">S/N</span>' :
              p.spayed_neutered === 'no'  ? '<span class="badge sn-no">Intact</span>' : ''}
          </div>
          <div class="pet-card-meta">
            ${p.breed ? `<span>${p.breed}</span>` : ''}
            ${p.age   ? `<span>${p.age} yrs</span>` : ''}
            ${p.weight ? `<span>${p.weight} lbs</span>` : ''}
          </div>
        </div>
      `).join('');
    } catch (err) {
      list.innerHTML = `<div class="empty-state" style="color:#a00">Error: ${err.message}</div>`;
    }
  }

  // ─── PET SELECTION ─────────────────────────────────────────────
  async function selectPet(pet) {
    selectedPetId  = pet.id;
    selectedPetObj = pet;

    document.querySelectorAll('.pet-card').forEach(el => el.classList.remove('selected'));
    document.getElementById(`pet-${pet.id}`).classList.add('selected');

    // Update vaccine section
    document.getElementById('selectedPetBadge').style.display = 'block';
    document.getElementById('selectedPetName').textContent    = pet.name;
    document.getElementById('logVaxBtn').disabled             = false;

    // Load vaccine history for this pet
    await loadVaxHistory(pet.id, pet.name);
  }

  function clearSelectedPet() {
    selectedPetId  = null;
    selectedPetObj = null;
    document.querySelectorAll('.pet-card').forEach(el => el.classList.remove('selected'));
    document.getElementById('selectedPetBadge').style.display = 'none';
    document.getElementById('logVaxBtn').disabled             = true;
  }

  // ─── ADD PET ───────────────────────────────────────────────────
  async function addPet() {
    const msg  = document.getElementById('addPetMsg');
    const name = document.getElementById('newPetName').value.trim();
    const spec = document.getElementById('newPetSpecies').value;

    if (!name)  { showMsg(msg, 'error', 'Pet name is required.'); return; }
    if (!spec)  { showMsg(msg, 'error', 'Please select a species.'); return; }

    try {
      await sbPost('pets', {
        client_id:       currentClient.id,
        name,
        species:         spec,
        breed:           document.getElementById('newPetBreed').value.trim()  || null,
        age:             document.getElementById('newPetAge').value    ? +document.getElementById('newPetAge').value    : null,
        weight:          document.getElementById('newPetWeight').value ? +document.getElementById('newPetWeight').value : null,
        spayed_neutered: document.getElementById('newPetSN').value     || 'unknown'
      });

      showMsg(msg, 'success', `${name} added!`);
      // Clear form
      ['newPetName','newPetBreed','newPetAge','newPetWeight'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('newPetSpecies').value = '';
      document.getElementById('newPetSN').value = 'unknown';
      // Reload pets
      await loadPets(currentClient.id);
    } catch (err) {
      showMsg(msg, 'error', err.message);
    }
  }

  // ─── LOG VACCINE ───────────────────────────────────────────────
  async function logVaccine() {
    const msg  = document.getElementById('logVaxMsg');
    const vaxSelect = document.getElementById('vaxName').value;
    const vaxOther  = document.getElementById('vaxNameOther').value.trim();
    const vaccineName = vaxSelect === 'Other' ? vaxOther : vaxSelect;
    const dateGiven = document.getElementById('vaxDate').value;

    if (!selectedPetId) { showMsg(msg, 'error', 'Please select a pet first.'); return; }
    if (!vaccineName)   { showMsg(msg, 'error', 'Please select or enter a vaccine name.'); return; }
    if (!dateGiven)     { showMsg(msg, 'error', 'Please enter the date given.'); return; }

    try {
      await sbPost('vaccinations', {
        pet_id:          selectedPetId,
        vaccine_name:    vaccineName,
        date_given:      dateGiven,
        next_due:        document.getElementById('vaxNextDue').value || null,
        administered_by: document.getElementById('vaxAdmin').value.trim() || null
      });

      showMsg(msg, 'success', `${vaccineName} logged for ${selectedPetObj.name}!`);
      // Clear form
      document.getElementById('vaxName').value     = '';
      document.getElementById('vaxNameOther').value = '';
      document.getElementById('vaxDate').value      = '';
      document.getElementById('vaxNextDue').value   = '';
      document.getElementById('vaxAdmin').value     = '';
      // Reload history
      await loadVaxHistory(selectedPetId, selectedPetObj.name);
    } catch (err) {
      showMsg(msg, 'error', err.message);
    }
  }

  // ─── VAX HISTORY ───────────────────────────────────────────────
  async function loadVaxHistory(petId, petName) {
    const content = document.getElementById('vaxHistoryContent');
    content.innerHTML = '<div class="empty-state">Loading…</div>';

    try {
      const records = await sbGet(`vaccinations?pet_id=eq.${petId}&order=date_given.desc`);

      if (!records.length) {
        content.innerHTML = `<div class="empty-state">No vaccines on record for ${petName}.</div>`;
        return;
      }

      const fmt = d => d ? new Date(d).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }) : '—';

      content.innerHTML = `
        <p style="font-size:0.82rem; color:var(--text-muted); margin-bottom:0.75rem">
          Showing history for <strong>${petName}</strong>
        </p>
        <div style="overflow-x:auto">
          <table class="vax-table">
            <thead>
              <tr>
                <th>Vaccine</th>
                <th>Date Given</th>
                <th>Next Due</th>
                <th>Administered By</th>
              </tr>
            </thead>
            <tbody>
              ${records.map(r => `
                <tr>
                  <td><strong>${r.vaccine_name}</strong></td>
                  <td>${fmt(r.date_given)}</td>
                  <td>${fmt(r.next_due)}</td>
                  <td>${r.administered_by || '—'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    } catch (err) {
      content.innerHTML = `<div class="empty-state" style="color:#a00">Error: ${err.message}</div>`;
    }
  }

  // ─── HELPERS ───────────────────────────────────────────────────
  function resetDetailPanel() {
    document.getElementById('detailEmpty').style.display = 'block';
    document.getElementById('clientInfo').style.display  = 'none';
    ['petsCard','vaxCard','historyCard'].forEach(id => document.getElementById(id).style.display = 'none');
  }

  function showMsg(el, type, text) {
    el.className   = `msg ${type}`;
    el.textContent = text;
    setTimeout(() => { el.className = 'msg'; }, 4000);
  }

  function toggleSection(contentId, iconId) {
    const content = document.getElementById(contentId);
    const icon    = document.getElementById(iconId);
    content.classList.toggle('open');
    icon.classList.toggle('open');
  }

  // Set today's date as default for vaccine date field
  document.getElementById('vaxDate').value = new Date().toISOString().split('T')[0];
</script>
</body>
</html>
