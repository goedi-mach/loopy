<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — People Helping Pets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy:        #1a3a8f;
      --navy-dark:   #122a6e;
      --navy-mid:    #4a6cc0;
      --coral:       #f28b82;
      --coral-dark:  #d96b62;
      --text:        #1a1a2e;
      --text-muted:  #5a6380;
      --border:      #c8d3ec;
      --white:       #ffffff;
      --shadow-lg:   0 8px 32px rgba(26,58,143,0.15);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 60%, var(--navy-mid) 100%);
    }

    .login-card {
      background: var(--white);
      border-radius: 20px;
      box-shadow: var(--shadow-lg);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      margin: 1rem;
    }

    .login-card h1 {
      font-family: 'Nunito', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--navy);
      text-align: center;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      text-align: center;
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .login-field { margin-bottom: 1.1rem; }

    .login-field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
      color: var(--text);
    }

    .login-field input {
      width: 100%;
      padding: 0.65rem 0.9rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: 'Nunito Sans', sans-serif;
      font-size: 0.95rem;
      color: var(--text);
      background: #f8faff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .login-field input:focus {
      outline: none;
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(26,58,143,0.15);
      background: var(--white);
    }

    .btn-login {
      width: 100%;
      background: var(--navy);
      color: white;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      padding: 0.8rem;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 4px 16px rgba(26,58,143,0.3);
    }

    .btn-login:hover { background: var(--navy-dark); }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

    .error-msg {
      color: var(--coral-dark);
      font-size: 0.83rem;
      text-align: center;
      margin-top: 0.75rem;
      min-height: 1.2em;
    }
  </style>
  <script src="config.js"></script>
<script>
  if (window.location.hostname.includes('sandbox')) {
    document.addEventListener('DOMContentLoaded', function() {
      const banner = document.createElement('div');
      banner.style.cssText = 'background:#f28b82;color:#fff;text-align:center;padding:0.5rem;font-family:Nunito,sans-serif;font-weight:700;font-size:0.9rem;letter-spacing:0.03em;position:sticky;top:0;z-index:9999;';
      banner.textContent = '🧪 SANDBOX — This is a test environment. No real data will be affected.';
      document.body.prepend(banner);
    });
  }
</script>
</head>
<body>
  <div class="login-card">
    <h1>🐾 PHP Clinic App</h1>
    <p class="subtitle">People Helping Pets — Chicago</p>

    <div class="login-field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="you@peoplehelpingpets.org" autocomplete="username" />
    </div>
    <div class="login-field">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" />
    </div>

    <button class="btn-login" id="loginBtn" onclick="login()">Sign In</button>
    <p class="error-msg" id="errorMsg"></p>
  </div>

  <script>
    const SUPABASE_URL      = CONFIG.SUPABASE_URL;
    const SUPABASE_ANON_KEY = CONFIG.SUPABASE_ANON_KEY;

    // ── Decode role from JWT ──────────────────────────────────────
    function getRoleFromToken(token) {
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        return payload.app_metadata?.role || 'volunteer';
      } catch {
        return 'volunteer';
      }
    }

    function redirectForRole(role) {
      if (role === 'staff' || role === 'admin') {
        window.location.href = 'staff-home.html';
      } else {
        window.location.href = 'volunteer-home.html';
      }
    }

    // ── On page load: skip login if already authenticated ────────
    const savedToken = localStorage.getItem('php_token');
    if (savedToken) {
      redirectForRole(getRoleFromToken(savedToken));
    }

    // Show session expired message if redirected here with ?expired=1
    if (new URLSearchParams(window.location.search).get('expired') === '1') {
      document.getElementById('errorMsg').textContent = 'Your session has expired. Please sign in again.';
    }

    // ── Login ─────────────────────────────────────────────────────
    async function login() {
      const email    = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn      = document.getElementById('loginBtn');
      const errorMsg = document.getElementById('errorMsg');

      if (!email || !password) {
        errorMsg.textContent = 'Please enter your email and password.';
        return;
      }

      btn.disabled    = true;
      btn.textContent = 'Signing in…';
      errorMsg.textContent = '';

      try {
        const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
          body:    JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error_description || data.msg || 'Login failed');

        localStorage.setItem('php_token', data.access_token);
        localStorage.setItem('php_refresh_token', data.refresh_token);
        localStorage.setItem('php_email', email);

        redirectForRole(getRoleFromToken(data.access_token));
      } catch (err) {
        errorMsg.textContent = err.message;
        btn.disabled    = false;
        btn.textContent = 'Sign In';
      }
    }

    // ── Enter key on password field ───────────────────────────────
    document.getElementById('loginPassword').addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
